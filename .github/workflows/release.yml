# Manual release, the only way this repository releases.
#
#   gh workflow run release.yml -f version=2.0.0
#
# The release pull request (CHANGELOG.md section) is merged first, see
# .claude/skills/release/SKILL.md. A Release created with GITHUB_TOKEN triggers
# no other workflow, so the image build is called from here.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 2.0.0 or 2.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: EduIDE/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      tag_prefix: "v"
      # A release is built on a released EduIDE edition image, never on a
      # pull request build such as pr-221.
      version_check: |
        base=$(sed -n 's/^ARG EDUIDE_VERSION=//p' Dockerfile)
        if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=Dockerfile::EDUIDE_VERSION is '$base', a release needs a released EduIDE version (X.Y.Z)."
          exit 1
        fi

  image:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      # Passed explicitly: without it the shared build workflow derives `latest`.
      image_tag: ${{ inputs.version }}
    secrets: inherit

  verify:
    needs: [release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Image exists for amd64 and arm64
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref="ghcr.io/eduide/eduide-image-mannheim/java-25:${VERSION}"
          archs=$(docker buildx imagetools inspect "$ref" --raw | jq -r '[.manifests[].platform.architecture] | join(",")')
          echo "${ref} -> ${archs}"
          [[ "$archs" == *amd64* && "$archs" == *arm64* ]] || { echo "::error::${ref} is missing amd64 or arm64 (${archs})"; exit 1; }
          {
            echo "## Released ${TAG}"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Last: publishing the draft creates the tag. Until here a failed job leaves
  # a draft and no tag.
  publish-release:
    needs: [release, verify]
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release-publish.yml@main
    with:
      tag: ${{ needs.release.outputs.tag }}
